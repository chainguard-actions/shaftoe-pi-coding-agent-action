name: Daily Dependency Update

# ─────────────────────────────────────────────────────────────────────────────
# Runs daily at 03:00 UTC and can also be triggered manually.
# Uses a matrix strategy to update dependencies in all package.json files in
# parallel, then creates a single PR if at least one package was updated.
# ─────────────────────────────────────────────────────────────────────────────

on:
  schedule:
    - cron: "0 3 * * *" # every day at 03:00 UTC
  workflow_dispatch:

# NOTE: We use PAT_TOKEN (not GITHUB_TOKEN) so that the PR created in the
# final job triggers downstream workflows (e.g. pr.yml). Events triggered by
# GITHUB_TOKEN do not fire other workflows (GitHub prevents recursive runs).
# A PAT bypasses this restriction.
permissions:
  contents: write
  pull-requests: write

env:
  GH_TOKEN: ${{ secrets.GH_PAT }}

jobs:
  update:
    strategy:
      fail-fast: false
      matrix:
        dir:
          - '.'
          - 'packages/pi-action'
          - 'packages/pi-action-bridge'
          - 'packages/pi-cli'
          - 'packages/pi-orchestrator'
          - 'packages/pi-platform-github'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - run: bun install --frozen-lockfile

      - name: Update dependencies
        id: update-deps
        uses: shaftoe/update-bun-dependencies-action@7e2b0f455893bdbcdc9097f26b4f45b9a0dc03d4 # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
        with:
          working-directory: ${{ matrix.dir }}
          latest: 'true'
          create-pr: 'false'

      - name: Extract changed package.json files
        id: changes
        env:
          MATRIX_DIR: ${{ matrix.dir }}
        run: |
          CHANGED=$(git diff --name-only)
          if [ -z "${CHANGED}" ]; then
            echo "No changes in ${MATRIX_DIR}"
            echo "has-changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "has-changes=true" >> "$GITHUB_OUTPUT"
          FILES=""
          for file in ${CHANGED}; do
            # Skip generated / lock files — we'll regenerate them in the final job
            case "${file}" in
              bun.lock | dist/*) echo "Skipping ${file}" ;;
              *)
                echo "Staging ${file}"
                FILES="${FILES} ${file}"
                ;;
            esac
          done

          if [ -n "${FILES}" ]; then
            SAFE_NAME=$(printf '%s' "${MATRIX_DIR}" | sed 's|^\.$|root|; s|/|-|g')
            echo "file-list=${FILES}" >> "$GITHUB_OUTPUT"
            safe_sanitized=$(printf '%s' "${SAFE_NAME}" | tr -d '\n\r')
            echo "safe-name=${safe_sanitized}" >> "$GITHUB_OUTPUT"
          else
            echo "has-changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload changed files
        if: ${{ steps.changes.outputs.has-changes == 'true' }}
        shell: bash
        id: archive
        env:
          CHANGES_SAFE_NAME: ${{ steps.changes.outputs.safe-name }}
          CHANGES_FILE_LIST: ${{ steps.changes.outputs.file-list }}
        run: |
          SAFE_NAME=$(printf '%s' "${CHANGES_SAFE_NAME}" | tr -d '\n\r')
          ARCHIVE="/tmp/updates-${SAFE_NAME}.tar"
          # Tokenize the file list safely
          files=()
          if [ -n "${CHANGES_FILE_LIST}" ]; then
            while IFS= read -r -d '' t; do files+=("$t"); done \
              < <(printf '%s' "${CHANGES_FILE_LIST}" | xargs printf '%s\0')
          fi
          tar cf "${ARCHIVE}" "${files[@]}"
          safe_archive=$(printf '%s' "updates-${SAFE_NAME}.tar" | tr -d '\n\r')
          echo "archive-name=${safe_archive}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ steps.changes.outputs.has-changes == 'true' }}
        with:
          name: ${{ steps.archive.outputs.archive-name }}
          path: /tmp/updates-${{ steps.changes.outputs.safe-name }}.tar
          retention-days: 1

  create-pr:
    needs: update
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download update archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: updates-*.tar
          path: /tmp/updates
          merge-multiple: true

      - name: Apply updates
        id: apply
        run: |
          ARCHIVES=$(find /tmp/updates -name 'updates-*.tar' 2>/dev/null | sort)
          if [ -z "${ARCHIVES}" ]; then
            echo "No archives found — no dependencies were updated."
            echo "has-updates=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          for archive in ${ARCHIVES}; do
            echo "Extracting: ${archive}"
            tar xf "${archive}"
          done

          echo "has-updates=true" >> "$GITHUB_OUTPUT"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Regenerate lockfile and dist
        if: ${{ steps.apply.outputs.has-updates == 'true' }}
        run: |
          bun install
          bun run package

      - name: Commit and push changes
        if: ${{ steps.apply.outputs.has-updates == 'true' }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          git reset -- dist/
          git commit -m 'chore(deps): update dependencies'
          git push origin HEAD:refs/heads/deps/update --force

      - name: Create or update Pull Request
        if: ${{ steps.apply.outputs.has-updates == 'true' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ secrets.GH_PAT }}
          script: |
            const { owner, repo } = context.repo;
            const branch = 'deps/update';
            const title = 'chore: update dependencies';
            const body = 'Automated dependency update across the monorepo workspace.';
            const labels = ['dependencies', 'automated'];
            const base = context.payload.repository?.default_branch || 'main';

            const { data: existing } = await github.rest.pulls.list({
              owner, repo,
              head: `${owner}:${branch}`,
              state: 'open',
            });

            if (existing.length > 0) {
              await github.rest.pulls.update({
                owner, repo,
                pull_number: existing[0].number,
                title, body,
              });
              await github.rest.issues.setLabels({
                owner, repo,
                issue_number: existing[0].number,
                labels,
              });
              core.notice(`Updated existing PR #${existing[0].number}`);
            } else {
              const { data: pr } = await github.rest.pulls.create({
                owner, repo,
                title, body,
                head: branch,
                base,
              });
              await github.rest.issues.addLabels({
                owner, repo,
                issue_number: pr.number,
                labels,
              });
              core.notice(`Created new PR #${pr.number}`);
            }
