name: Pi AI Agent

on:
  workflow_call:
    inputs:
      prompt:
        type: string
        required: false
      allowed_actor:
        type: string
        required: false
    secrets:
      token:
        required: true
      gh_token:
        required: true
      opengist_token:
        # Opengist access token (og_…) used by the opengist share provider.
        # Must be declared here so callers can pass it through — reusable
        # workflows only see secrets listed under `workflow_call.secrets`, so
        # an undeclared `secrets.OPENGIST_TOKEN` silently resolves to empty.
        required: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  pi-agent:
    if: |
      (startsWith(github.event.comment.body, '/pi ') || startsWith(github.event.review.body, '/pi ')) &&
      (inputs.allowed_actor == '' || github.actor == inputs.allowed_actor)

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || '' }}
          fetch-depth: 0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Run Pi agent
        id: pi
        uses: shaftoe/pi-coding-agent-action@301b3a9dde32f4a8755f24e12a7187e4dec2a096 # develop
        env:
          PI_SHARE_VIEWER_URL: https://gistviewer.l3x.in/
        with:
          share_session: true
          share_gist_provider: opengist
          share_gist_api_url: https://gist.l3x.in/api/gists
          share_gist_token: ${{ secrets.opengist_token }}
          github_token: ${{ secrets.gh_token }}
          provider: ${{ vars.PROVIDER }}
          model: ${{ vars.MODEL }}
          token: ${{ secrets.token }}
          thinking_level: ${{ vars.THINKING_LEVEL }}
          prompt: ${{ inputs.prompt }}
          diff_ignore_patterns: 'dist/ bun.lock node_modules/'

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ steps.pi.outputs.session_html_path }}
        with:
          name: pi-session-html-${{ github.event.issue.number || github.event.pull_request.number || github.run_number }}
          path: ${{ steps.pi.outputs.session_html_path }}
