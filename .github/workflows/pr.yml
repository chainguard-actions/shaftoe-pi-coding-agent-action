name: Review PR

on:
  pull_request:
    types: [opened, edited, synchronize]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  pi-agent:
    if: github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || '' }}
          fetch-depth: 0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Run Pi agent
        id: pi
        uses: shaftoe/pi-coding-agent-action@ff672573b4f2404d7f8e2cf896f8c186988e83ae # develop
        with:
          export_session_html: true
          github_token: ${{ secrets.GITHUB_TOKEN }}
          provider: ${{ vars.PROVIDER }}
          model: ${{ vars.MODEL }}
          token: ${{ secrets.API_KEY }}
          thinking_level: ${{ vars.THINKING_LEVEL }}
          diff_ignore_patterns: 'dist/ bun.lock node_modules/'
          prompt: |
            This is a GitHub PR (#${{ github.event.pull_request.number }}) that needs code review. Focus on identifying issues, bugs, security concerns, and improvements. Don't apply any changes yourself, just review and suggest improvements.

            Before reviewing, use get_issue_or_pr_thread to fetch any existing review comments so you don't duplicate feedback that has already been given.

            If the change involves upgrading dependencies, with special focus on @earendil-works/pi-coding-agent, ensure the version is up-to-date and no breaking changes are introduced. If the change is a new feature, evaluate if it's interesting or useful and suggest a possible implementation to make use of it.

            Once you're done, add your findings as comment to the PR.

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ steps.pi.outputs.session_html_path }}
        with:
          name: pi-session-html-${{ github.event.issue.number || github.event.pull_request.number || github.run_number }}
          path: ${{ steps.pi.outputs.session_html_path }}
