name: Test no prompt scenario
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # When no prompt is provided and the event is workflow_dispatch (not a comment),
      # the action should fail with "No prompt found - cannot proceed"
      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          provider: openai
          model: gpt-4o
          token: fake-token
          # No prompt input — action should fail with "No prompt found"

      - name: Assert action failed due to no prompt
        env:
          OUTCOME: ${{ steps.action.outcome }}
          SUCCESS: ${{ steps.action.outputs.success }}
          RESPONSE: ${{ steps.action.outputs.response }}
        run: |
          echo "outcome: $OUTCOME"
          echo "success: $SUCCESS"
          echo "response: $RESPONSE"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when no prompt is provided, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when no prompt was provided"

      - name: Assert success is false when no prompt
        env:
          SUCCESS: ${{ steps.action.outputs.success }}
        run: |
          echo "success: $SUCCESS"
          if [ "$SUCCESS" != "false" ]; then
            echo "FAIL: expected success=false when no prompt, got: $SUCCESS"
            exit 1
          fi
          echo "PASS: success=false as expected"

      - name: Assert response contains error message
        env:
          RESPONSE: ${{ steps.action.outputs.response }}
        run: |
          echo "response: $RESPONSE"
          if [ -z "$RESPONSE" ]; then
            echo "FAIL: response output was empty, expected an error message"
            exit 1
          fi
          echo "PASS: response contains error message: '$RESPONSE'"
