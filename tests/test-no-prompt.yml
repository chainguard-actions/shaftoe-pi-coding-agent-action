name: Test no prompt available
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          provider: 'openai'
          model: 'gpt-4o'
          token: 'fake-api-token-for-testing'
          # No prompt input — action should fail with "No prompt found"

      - name: Assert action failed due to no prompt
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when no prompt is available, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when no prompt was available"
