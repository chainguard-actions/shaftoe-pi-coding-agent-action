name: Test no prompt fails with clear message
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          provider: openai
          model: gpt-4o
          token: not-a-real-llm-key
          refresh_model_catalog: 'false'
      - name: Assert action failed with no-prompt error
        env:
          OUTCOME: ${{ steps.action.outcome }}
          RESPONSE: ${{ steps.action.outputs.response }}
          SUCCESS: ${{ steps.action.outputs.success }}
          DURATION: ${{ steps.action.outputs.duration_seconds }}
        run: |
          echo "outcome: $OUTCOME"
          echo "response: $RESPONSE"
          echo "success: $SUCCESS"
          echo "duration: $DURATION"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure outcome"
            exit 1
          fi
          if [ "$RESPONSE" != "No prompt found - cannot proceed" ]; then
            echo "FAIL: unexpected response"
            exit 1
          fi
          if [ "$SUCCESS" != "false" ]; then
            echo "FAIL: expected success=false"
            exit 1
          fi
          if [ -z "$DURATION" ]; then
            echo "FAIL: expected duration_seconds to be set"
            exit 1
          fi
          echo "PASS"
