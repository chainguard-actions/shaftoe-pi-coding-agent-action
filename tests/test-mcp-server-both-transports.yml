name: Test MCP server with both command and url is rejected
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          provider: openai
          model: gpt-4o
          token: not-a-real-llm-key
          prompt: say hello
          refresh_model_catalog: 'false'
          mcp_servers: '{"mcpServers": {"dual": {"command": "echo", "url": "https://example.com/mcp"}}}'
      - name: Assert action failed during config validation
        env:
          OUTCOME: ${{ steps.action.outcome }}
          SUCCESS: ${{ steps.action.outputs.success }}
          RESPONSE: ${{ steps.action.outputs.response }}
        run: |
          echo "outcome: $OUTCOME"
          echo "success: $SUCCESS"
          echo "response: $RESPONSE"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure outcome"
            exit 1
          fi
          if [ -n "$SUCCESS" ] || [ -n "$RESPONSE" ]; then
            echo "FAIL: expected no outputs when MCP entry is invalid"
            exit 1
          fi
          echo "PASS"
