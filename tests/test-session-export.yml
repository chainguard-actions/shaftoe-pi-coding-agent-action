name: Test session export outputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          provider: openai
          model: gpt-4o
          token: fake-llm-token-for-testing
          prompt: "Say hello in one word."
          export_session_html: 'true'
          export_session_jsonl: 'true'
          thinking_level: 'off'

      - name: Assert session export outputs or graceful failure
        env:
          OUTCOME: ${{ steps.action.outcome }}
          HTML_PATH: ${{ steps.action.outputs.session_html_path }}
          JSONL_PATH: ${{ steps.action.outputs.session_jsonl_path }}
          SUCCESS: ${{ steps.action.outputs.success }}
        run: |
          echo "outcome: $OUTCOME"
          echo "session_html_path: $HTML_PATH"
          echo "session_jsonl_path: $JSONL_PATH"
          echo "success: $SUCCESS"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$HTML_PATH" ]; then
              echo "FAIL: export_session_html=true but session_html_path output is empty"
              exit 1
            fi
            if [ ! -f "$HTML_PATH" ]; then
              echo "FAIL: session_html_path '$HTML_PATH' does not exist on disk"
              exit 1
            fi
            if [ -z "$JSONL_PATH" ]; then
              echo "FAIL: export_session_jsonl=true but session_jsonl_path output is empty"
              exit 1
            fi
            if [ ! -f "$JSONL_PATH" ]; then
              echo "FAIL: session_jsonl_path '$JSONL_PATH' does not exist on disk"
              exit 1
            fi
            echo "PASS: session export files exist at expected paths"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected without valid LLM credentials)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
