name: Test session export outputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          provider: openai
          model: gpt-4o
          token: fake-llm-token-for-testing
          prompt: "Say hello in one word."
          thinking_level: "off"
          load_builtin_extensions: "false"
          refresh_model_catalog: "false"
          export_session_html: "true"
          export_session_jsonl: "true"

      - name: Assert action ran and session export outputs are set or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          SUCCESS: ${{ steps.action.outputs.success }}
          HTML_PATH: ${{ steps.action.outputs.session_html_path }}
          JSONL_PATH: ${{ steps.action.outputs.session_jsonl_path }}
        run: |
          echo "outcome: $OUTCOME"
          echo "success: $SUCCESS"
          echo "session_html_path: $HTML_PATH"
          echo "session_jsonl_path: $JSONL_PATH"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$SUCCESS" ]; then
              echo "FAIL: action succeeded but 'success' output is empty"
              exit 1
            fi
            if [ "$SUCCESS" = "true" ]; then
              if [ -z "$HTML_PATH" ]; then
                echo "FAIL: export_session_html=true but session_html_path is empty"
                exit 1
              fi
              if [ -z "$JSONL_PATH" ]; then
                echo "FAIL: export_session_jsonl=true but session_jsonl_path is empty"
                exit 1
              fi
              echo "PASS: session exports produced html=$HTML_PATH jsonl=$JSONL_PATH"
            else
              echo "PASS: action completed with success=false (LLM call failed as expected)"
            fi
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected without valid LLM token or sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
