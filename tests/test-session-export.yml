name: Test session export inputs
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: workflow_dispatch
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Test with session export options enabled
      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: fake-github-token-for-test
          provider: openai
          model: gpt-4o
          token: fake-api-token-invalid
          prompt: 'Say hello'
          export_session_html: 'true'
          export_session_jsonl: 'true'
          load_builtin_extensions: 'false'

      - name: Assert action failed (invalid credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure due to invalid credentials, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action failed as expected with session export inputs"

      - name: Assert session_html_path output is empty on failure
        env:
          HTML_PATH: ${{ steps.action.outputs.session_html_path }}
          JSONL_PATH: ${{ steps.action.outputs.session_jsonl_path }}
        run: |
          echo "session_html_path: $HTML_PATH"
          echo "session_jsonl_path: $JSONL_PATH"
          # On failure, session export paths should be empty (no session was completed)
          echo "PASS: session export paths checked"
