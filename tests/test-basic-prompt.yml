name: Test basic prompt usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: fake-github-token
          provider: openai
          model: gpt-4o
          token: fake-api-token
          prompt: "Say hello in one word."
          thinking_level: "off"
          load_builtin_extensions: "false"

      - name: Assert success output is set
        env:
          SUCCESS: ${{ steps.action.outputs.success }}
        run: |
          echo "success: $SUCCESS"
          if [ -z "$SUCCESS" ]; then
            echo "FAIL: expected 'success' output to be set (true or false)"
            exit 1
          fi
          echo "PASS: success output is set to '$SUCCESS'"

      - name: Assert success is false (invalid token expected)
        env:
          SUCCESS: ${{ steps.action.outputs.success }}
        run: |
          echo "success: $SUCCESS"
          if [ "$SUCCESS" = "true" ]; then
            echo "PASS: agent completed successfully (unexpected but acceptable)"
          else
            echo "PASS: agent reported failure as expected with fake credentials"
          fi
