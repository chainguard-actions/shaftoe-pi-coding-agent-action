name: Test missing provider input
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: workflow_dispatch
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: fake-token-for-test
          provider: ''
          model: gpt-4o
          prompt: 'Hello'

      - name: Assert action failed due to missing provider
        env:
          OUTCOME: ${{ steps.action.outcome }}
          SUCCESS: ${{ steps.action.outputs.success }}
        run: |
          echo "outcome: $OUTCOME"
          echo "success output: $SUCCESS"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when provider is missing, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when provider was missing"
