name: Test prompt and trigger inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Test with explicit prompt and custom trigger phrase
      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          provider: openai
          model: gpt-4o
          token: fake-llm-token-for-testing
          prompt: "What is 2+2? Answer with just the number."
          trigger: '/mybot '
          thinking_level: 'off'
          update_comment: 'false'

      - name: Assert action ran with explicit prompt or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          SUCCESS: ${{ steps.action.outputs.success }}
          RESPONSE: ${{ steps.action.outputs.response }}
          DURATION: ${{ steps.action.outputs.duration_seconds }}
        run: |
          echo "outcome: $OUTCOME"
          echo "success: $SUCCESS"
          echo "response: $RESPONSE"
          echo "duration_seconds: $DURATION"
          if [ "$OUTCOME" = "success" ]; then
            if [ "$SUCCESS" != "true" ]; then
              echo "FAIL: action succeeded but success output is not 'true'"
              exit 1
            fi
            if [ -z "$RESPONSE" ]; then
              echo "FAIL: action succeeded but response output is empty"
              exit 1
            fi
            if [ -z "$DURATION" ]; then
              echo "FAIL: action succeeded but duration_seconds output is empty"
              exit 1
            fi
            echo "PASS: action completed with response and duration"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected without valid LLM credentials)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
