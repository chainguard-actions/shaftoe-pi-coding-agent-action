name: Test pull request event context
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/pull/1/merge
      GITHUB_EVENT_NAME: pull_request
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: fake-github-token
          provider: openai
          model: gpt-4o
          token: fake-api-token
          prompt: "Review this pull request and summarize the changes."
          thinking_level: "low"
          load_builtin_extensions: "false"
          diff_max_lines: "1000"
          diff_max_bytes: "102400"

      - name: Assert action ran without crashing the runner
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran (outcome: ${{ steps.action.outcome }})"

      - name: Assert success output is set
        env:
          SUCCESS: ${{ steps.action.outputs.success }}
        run: |
          echo "success: $SUCCESS"
          # With fake credentials, success should be 'false'
          if [ "$SUCCESS" = "true" ]; then
            echo "PASS: agent completed (unexpected with fake token but acceptable)"
          else
            echo "PASS: agent reported failure as expected with fake credentials"
          fi

      - name: Assert duration_seconds output is set on completion
        env:
          DURATION: ${{ steps.action.outputs.duration_seconds }}
        run: |
          echo "duration_seconds: '$DURATION'"
          echo "PASS: duration output checked"
