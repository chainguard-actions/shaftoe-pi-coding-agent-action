name: Test invalid API credentials
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: workflow_dispatch
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: fake-github-token-for-test
          provider: openai
          model: gpt-4o
          token: fake-api-token-invalid
          prompt: 'Say hello'
          load_builtin_extensions: 'false'

      - name: Assert action failed with invalid credentials
        env:
          OUTCOME: ${{ steps.action.outcome }}
          SUCCESS: ${{ steps.action.outputs.success }}
        run: |
          echo "outcome: $OUTCOME"
          echo "success output: $SUCCESS"
          # The action should fail (invalid credentials / API error)
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid credentials, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid credentials"

      - name: Assert success output is false or empty
        env:
          SUCCESS: ${{ steps.action.outputs.success }}
        run: |
          echo "success: $SUCCESS"
          # success should be 'false' or empty when the action fails
          if [ "$SUCCESS" = "true" ]; then
            echo "FAIL: expected success to be false or empty, but got 'true'"
            exit 1
          fi
          echo "PASS: success output is not 'true' as expected"
