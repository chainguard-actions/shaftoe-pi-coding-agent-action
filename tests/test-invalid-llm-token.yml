name: Test prompt with invalid LLM token reports failure outputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          provider: openai
          model: gpt-4o
          token: sk-invalid-test-key-0000000000000000
          prompt: Reply with the single word OK.
          refresh_model_catalog: 'false'
          load_builtin_extensions: 'false'
          export_session_html: 'false'
      - name: Assert agent failure is reported via outputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
          SUCCESS: ${{ steps.action.outputs.success }}
          RESPONSE: ${{ steps.action.outputs.response }}
          DURATION: ${{ steps.action.outputs.duration_seconds }}
        run: |
          echo "outcome: $OUTCOME"
          echo "success: $SUCCESS"
          echo "response: $RESPONSE"
          echo "duration: $DURATION"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure outcome with an invalid LLM token"
            exit 1
          fi
          if [ "$SUCCESS" != "false" ]; then
            echo "FAIL: expected success=false"
            exit 1
          fi
          if [ -z "$RESPONSE" ]; then
            echo "FAIL: expected a non-empty error response"
            exit 1
          fi
          if [ "$RESPONSE" = "No prompt found - cannot proceed" ]; then
            echo "FAIL: prompt input was not honored"
            exit 1
          fi
          if [ -z "$DURATION" ]; then
            echo "FAIL: expected duration_seconds to be set"
            exit 1
          fi
          echo "PASS"
