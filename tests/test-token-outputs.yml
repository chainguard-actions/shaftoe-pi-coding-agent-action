name: Test token and cost outputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          provider: openai
          model: gpt-4o
          token: fake-llm-token-for-testing
          prompt: "Reply with just the word: done"
          thinking_level: 'off'
          load_builtin_extensions: 'false'
          loaded_tools: 'all'

      - name: Assert token and cost outputs are present on success or graceful failure
        env:
          OUTCOME: ${{ steps.action.outcome }}
          SUCCESS: ${{ steps.action.outputs.success }}
          INPUT_TOKENS: ${{ steps.action.outputs.input_tokens }}
          OUTPUT_TOKENS: ${{ steps.action.outputs.output_tokens }}
          COST: ${{ steps.action.outputs.cost }}
          DURATION: ${{ steps.action.outputs.duration_seconds }}
        run: |
          echo "outcome: $OUTCOME"
          echo "success: $SUCCESS"
          echo "input_tokens: $INPUT_TOKENS"
          echo "output_tokens: $OUTPUT_TOKENS"
          echo "cost: $COST"
          echo "duration_seconds: $DURATION"
          if [ "$OUTCOME" = "success" ]; then
            if [ "$SUCCESS" != "true" ]; then
              echo "FAIL: action succeeded but success output is not 'true'"
              exit 1
            fi
            if [ -z "$INPUT_TOKENS" ]; then
              echo "FAIL: input_tokens output is empty"
              exit 1
            fi
            if [ -z "$OUTPUT_TOKENS" ]; then
              echo "FAIL: output_tokens output is empty"
              exit 1
            fi
            if [ -z "$COST" ]; then
              echo "FAIL: cost output is empty"
              exit 1
            fi
            if [ -z "$DURATION" ]; then
              echo "FAIL: duration_seconds output is empty"
              exit 1
            fi
            echo "PASS: all token/cost outputs are populated"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected without valid LLM credentials)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
