name: Test pr_number input for workflow_dispatch
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: workflow_dispatch
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Test with pr_number set (workflow_dispatch targeting a specific PR)
      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: fake-github-token-for-test
          provider: openai
          model: gpt-4o
          token: fake-api-token-invalid
          pr_number: '42'
          prompt: 'Review this PR'
          load_builtin_extensions: 'false'

      - name: Assert action failed (invalid credentials, not bad pr_number config)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # Should fail due to invalid credentials/API call, not due to pr_number misconfiguration
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure due to invalid credentials, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action failed as expected with pr_number input"
