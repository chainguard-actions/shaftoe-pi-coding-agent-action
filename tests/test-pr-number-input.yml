name: Test pr_number input for targeting a specific PR
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          provider: openai
          model: gpt-4o
          token: fake-llm-token-for-testing
          prompt: "Summarize this PR in one sentence."
          pr_number: '1'
          load_builtin_extensions: 'false'

      - name: Assert action ran gracefully with pr_number input
        env:
          OUTCOME: ${{ steps.action.outcome }}
          SUCCESS: ${{ steps.action.outputs.success }}
          RESPONSE: ${{ steps.action.outputs.response }}
        run: |
          echo "outcome: $OUTCOME"
          echo "success: $SUCCESS"
          echo "response: $RESPONSE"
          # The action will fail because the sentinel repo doesn't have PR #1,
          # or because the LLM token is fake — both are acceptable graceful failures.
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$SUCCESS" ]; then
              echo "FAIL: action succeeded but 'success' output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with pr_number=1, success=$SUCCESS"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo or fake LLM token)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
