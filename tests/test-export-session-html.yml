name: Test export session HTML output
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          provider: openai
          model: gpt-4o
          token: fake-llm-token-for-testing
          prompt: "Say hello in one word."
          export_session_html: 'true'
          load_builtin_extensions: 'false'

      - name: Assert action ran and check session_html_path output
        env:
          OUTCOME: ${{ steps.action.outcome }}
          SUCCESS: ${{ steps.action.outputs.success }}
          SESSION_HTML_PATH: ${{ steps.action.outputs.session_html_path }}
        run: |
          echo "outcome: $OUTCOME"
          echo "success: $SUCCESS"
          echo "session_html_path: $SESSION_HTML_PATH"
          if [ "$OUTCOME" = "success" ]; then
            if [ "$SUCCESS" = "true" ]; then
              # If the agent actually succeeded, session_html_path should be set
              if [ -z "$SESSION_HTML_PATH" ]; then
                echo "FAIL: action succeeded with export_session_html=true but session_html_path is empty"
                exit 1
              fi
              if [ ! -f "$SESSION_HTML_PATH" ]; then
                echo "FAIL: session_html_path '$SESSION_HTML_PATH' does not exist on disk"
                exit 1
              fi
              echo "PASS: session_html_path is set and file exists at $SESSION_HTML_PATH"
            else
              echo "PASS: action ran but agent did not succeed (success=$SUCCESS)"
            fi
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected without real LLM credentials or sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
