name: Test export session HTML output
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          provider: openai
          model: gpt-4o
          token: fake-token-for-testing
          prompt: "Say hello in one word."
          thinking_level: "off"
          export_session_html: "true"

      - name: Assert success output is set
        env:
          SUCCESS: ${{ steps.action.outputs.success }}
        run: |
          echo "success: $SUCCESS"
          if [ -z "$SUCCESS" ]; then
            echo "FAIL: expected 'success' output to be set (true or false), got empty"
            exit 1
          fi
          echo "PASS: success output is set to '$SUCCESS'"

      - name: Assert session_html_path output is set when export enabled
        env:
          HTML_PATH: ${{ steps.action.outputs.session_html_path }}
        run: |
          echo "session_html_path: $HTML_PATH"
          if [ -z "$HTML_PATH" ]; then
            echo "INFO: session_html_path is empty — may be unset on auth failure"
            SUCCESS="${{ steps.action.outputs.success }}"
            if [ "$SUCCESS" = "true" ]; then
              echo "FAIL: success=true but session_html_path is empty"
              exit 1
            fi
            echo "PASS: session_html_path empty is acceptable when action did not succeed"
          else
            echo "PASS: session_html_path is set to '$HTML_PATH'"
          fi
