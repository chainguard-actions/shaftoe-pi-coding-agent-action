name: Test basic usage (graceful failure without real LLM token)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          provider: openai
          model: gpt-4o
          token: fake-llm-token-for-testing
          prompt: "Say hello in one word."
          thinking_level: "off"
          load_builtin_extensions: "false"

      - name: Assert action ran and produced outputs or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          SUCCESS: ${{ steps.action.outputs.success }}
          RESPONSE: ${{ steps.action.outputs.response }}
        run: |
          echo "outcome: $OUTCOME"
          echo "success: $SUCCESS"
          echo "response: $RESPONSE"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$SUCCESS" ]; then
              echo "FAIL: action succeeded but 'success' output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with success=$SUCCESS"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected without real LLM credentials)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
