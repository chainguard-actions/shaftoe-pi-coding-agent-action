name: Test basic usage with required inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: fake-github-token
          provider: openai
          model: gpt-4o
          token: fake-api-token
          prompt: "Say hello"
          thinking_level: 'off'
      - name: Assert action ran (success or expected failure with invalid creds)
        env:
          SUCCESS: ${{ steps.action.outputs.success }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "success: $SUCCESS"
          # The action should either succeed or fail gracefully with invalid credentials.
          # We accept both 'success' and 'failure' outcomes since we used fake tokens.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran and produced an outcome"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
