name: Test default inputs and token outputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          provider: openai
          model: gpt-4o
          token: fake-token-for-testing
          prompt: "What is 1+1?"
          # thinking_level defaults to 'off'
          # trigger defaults to '/pi '
          # load_builtin_extensions defaults to 'true'
          # loaded_tools defaults to 'all'

      - name: Assert success output is set (true or false)
        env:
          SUCCESS: ${{ steps.action.outputs.success }}
        run: |
          echo "success: $SUCCESS"
          if [ -z "$SUCCESS" ]; then
            echo "FAIL: expected 'success' output to be set, got empty"
            exit 1
          fi
          echo "PASS: success='$SUCCESS'"

      - name: Assert duration_seconds is a non-negative number
        env:
          DURATION: ${{ steps.action.outputs.duration_seconds }}
        run: |
          echo "duration_seconds: $DURATION"
          if [ -z "$DURATION" ]; then
            echo "FAIL: expected duration_seconds to be set"
            exit 1
          fi
          # Check it looks like a number (integer or decimal)
          if ! echo "$DURATION" | grep -qE '^[0-9]+(\.[0-9]+)?$'; then
            echo "FAIL: duration_seconds '$DURATION' does not look like a number"
            exit 1
          fi
          echo "PASS: duration_seconds='$DURATION'"

      - name: Assert input_tokens output is set
        env:
          INPUT_TOKENS: ${{ steps.action.outputs.input_tokens }}
        run: |
          echo "input_tokens: $INPUT_TOKENS"
          # input_tokens may be 0 or empty on auth failure — just check it's not
          # an unexpected non-numeric value if set
          if [ -n "$INPUT_TOKENS" ]; then
            if ! echo "$INPUT_TOKENS" | grep -qE '^[0-9]+$'; then
              echo "FAIL: input_tokens '$INPUT_TOKENS' is not a non-negative integer"
              exit 1
            fi
          fi
          echo "PASS: input_tokens='$INPUT_TOKENS'"

      - name: Assert output_tokens output is set
        env:
          OUTPUT_TOKENS: ${{ steps.action.outputs.output_tokens }}
        run: |
          echo "output_tokens: $OUTPUT_TOKENS"
          if [ -n "$OUTPUT_TOKENS" ]; then
            if ! echo "$OUTPUT_TOKENS" | grep -qE '^[0-9]+$'; then
              echo "FAIL: output_tokens '$OUTPUT_TOKENS' is not a non-negative integer"
              exit 1
            fi
          fi
          echo "PASS: output_tokens='$OUTPUT_TOKENS'"
