name: Test default input values
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: workflow_dispatch
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Invoke with only required inputs — all optional inputs use defaults
      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: fake-github-token-for-test
          provider: anthropic
          model: claude-sonnet-4-5
          token: fake-api-token-invalid
          prompt: 'What is 2+2?'
          # thinking_level defaults to 'off'
          # load_builtin_extensions defaults to 'true'
          # loaded_tools defaults to 'all'
          # export_session_html defaults to 'false'
          # export_session_jsonl defaults to 'false'
          # share_session defaults to 'false'
          # auto_compaction defaults to 'false'
          # platform defaults to 'github'

      - name: Assert action ran (failed due to invalid creds, not missing inputs)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail due to invalid credentials, not due to missing inputs.
          # If it fails, that means it got past input validation (required inputs are present).
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail (invalid creds), but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action failed as expected (invalid credentials, not missing inputs)"

      - name: Assert success output is not true
        env:
          SUCCESS: ${{ steps.action.outputs.success }}
        run: |
          echo "success: $SUCCESS"
          if [ "$SUCCESS" = "true" ]; then
            echo "FAIL: expected success to be false or empty"
            exit 1
          fi
          echo "PASS: success is not 'true'"
