name: Test default input values
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          provider: openai
          model: gpt-4o
          token: fake-llm-token-for-testing
          prompt: "What is 1+1?"
          thinking_level: "off"
          trigger: "/pi "
          load_builtin_extensions: "true"
          loaded_tools: "all"
          diff_max_lines: "1000"
          diff_max_bytes: "102400"
          refresh_model_catalog: "false"
          auto_compaction: "false"
          update_comment: "false"
          platform: "github"

      - name: Assert action ran with default inputs or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          SUCCESS: ${{ steps.action.outputs.success }}
          DURATION: ${{ steps.action.outputs.duration_seconds }}
          COST: ${{ steps.action.outputs.cost }}
        run: |
          echo "outcome: $OUTCOME"
          echo "success: $SUCCESS"
          echo "duration_seconds: $DURATION"
          echo "cost: $COST"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$SUCCESS" ]; then
              echo "FAIL: action succeeded but 'success' output is empty"
              exit 1
            fi
            echo "PASS: action completed with success=$SUCCESS duration=$DURATION cost=$COST"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected without valid LLM token or sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
