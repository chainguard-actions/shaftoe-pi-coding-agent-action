name: Test thinking level input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          provider: anthropic
          model: claude-3-5-sonnet-20241022
          token: fake-llm-token-for-testing
          prompt: "Say hello in one word."
          thinking_level: "low"

      - name: Assert action ran with thinking_level=low
        env:
          OUTCOME: ${{ steps.action.outcome }}
          SUCCESS: ${{ steps.action.outputs.success }}
          DURATION: ${{ steps.action.outputs.duration_seconds }}
        run: |
          echo "outcome: $OUTCOME"
          echo "success: $SUCCESS"
          echo "duration_seconds: $DURATION"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$SUCCESS" ]; then
              echo "FAIL: action succeeded but 'success' output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with thinking_level=low, success=$SUCCESS"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected — no real LLM token)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
