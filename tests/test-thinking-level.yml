name: Test thinking_level input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          provider: anthropic
          model: claude-opus-4-5
          token: fake-llm-token-for-testing
          prompt: "Say hello."
          thinking_level: "low"
          load_builtin_extensions: "false"

      - name: Assert action ran (thinking_level=low accepted) or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          SUCCESS: ${{ steps.action.outputs.success }}
        run: |
          echo "outcome: $OUTCOME"
          echo "success: $SUCCESS"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$SUCCESS" ]; then
              echo "FAIL: action succeeded but 'success' output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with thinking_level=low, success=$SUCCESS"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected without real LLM credentials)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
